; php-fpm pool for the JubahRunner landing page.
;
; Install to /etc/php/8.4/fpm/pool.d/runnerconvo.conf, then
; `systemctl restart php8.4-fpm`.
;
; This app gets its own pool rather than sharing www so that PHP runs as the
; unprivileged `runnerconvo` user — same per-app isolation every other app on
; this box gets from its own system user and systemd unit.

[runnerconvo]

user = runnerconvo
group = runnerconvo

; Apache (www-data) must be able to write to the socket; the pool itself still
; runs as runnerconvo.
listen = /run/php/php8.4-fpm-runnerconvo.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A static landing page with no database. `ondemand` keeps idle memory near zero
; on a 5.7G box that already runs MySQL, Postgres, Redis, Docker and four Python
; services. Revisit if the registration form ever lands here.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Laravel needs none of these, and the app takes public input.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[allow_url_fopen] = off

; Never leak stack traces to visitors — APP_DEBUG=false covers Laravel's own
; errors, this covers PHP's.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; Laravel resolves its own .env; keep the pool from inheriting the box's env.
clear_env = yes
