# Apache vhost for the JubahRunner landing page.
#
# Matches the box's convention (see finance.dhiyadanial.my.conf): a plain :80 vhost is
# installed and enabled first, then `certbot --apache -d <host>` rewrites this file in
# place to add the HTTPS redirect and generates the paired *-le-ssl.conf itself. Don't
# hand-write the -le-ssl file or the redirect block — let certbot do both.
#
# NAMED AFTER THE APP, NOT THE DOMAIN, on purpose. Every other vhost on this box is
# named after its hostname, but convo.dhiyadanial.my is explicitly temporary — the team
# moves to a root domain (probably jubahrunner.my) later. Keeping the filename
# app-shaped means the domain switch is a one-line ServerName edit plus a certbot
# re-run, with no file rename and no certbot state to untangle.
#
# ---------------------------------------------------------------------------------
# ServerName below is the ONLY place the hostname appears anywhere in this repo.
# The app itself learns its URL from APP_URL in /opt/runnerconvo/runnerconvo/.env,
# which lives only on the VPS. Do not hardcode the hostname anywhere else.
# ---------------------------------------------------------------------------------
#
# Unlike every other app on this box, this is NOT a reverse proxy to a loopback port —
# Laravel is served by php-fpm, so Apache owns the docroot directly and hands .php off
# over a unix socket. There is no port to claim and no systemd unit for this app.

<VirtualHost *:80>
    ServerName convo.dhiyadanial.my

    # Laravel's front controller lives in public/ — never expose the repo root, or
    # .env and the whole vendor tree become fetchable over HTTP.
    DocumentRoot /opt/runnerconvo/runnerconvo/public

    <Directory /opt/runnerconvo/runnerconvo/public>
        Options FollowSymLinks
        # Laravel ships a public/.htaccess doing the front-controller rewrite.
        AllowOverride All
        Require all granted
    </Directory>

    # Hand PHP to this app's own php-fpm pool, which runs as the unprivileged
    # `runnerconvo` user. mpm_event is in use on this box, so mod_php is not an
    # option; this needs `a2enmod proxy_fcgi`.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-runnerconvo.sock|fcgi://localhost/"
    </FilesMatch>

    # Long-cache the Vite build output. Filenames are content-hashed, so this is safe.
    <Directory /opt/runnerconvo/runnerconvo/public/build>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/runnerconvo-error.log
    CustomLog ${APACHE_LOG_DIR}/runnerconvo-access.log combined
</VirtualHost>
